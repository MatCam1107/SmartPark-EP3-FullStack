spring.application.name=smartpark-backend

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/smartpark_db
spring.datasource.username=smartpark_user
spring.datasource.password=${SMARTPARK_DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Puerto del servidor
server.port=8080

# Configuracion de JWT
smartpark.jwt.secret=${SMARTPARK_JWT_SECRET}
smartpark.jwt.expiration=7200